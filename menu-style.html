<style>
/* Reset et base mobile-first */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #ff6b35 0%, #f7931e 50%, #d63031 100%);
  min-height: 100vh;
  color: #333;
  overflow-x: hidden;
}

/* Header pizzeria */
header {
  text-align: center;
  padding: 20px 15px;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(10px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}

header h1 {
  font-size: 28px;
  margin-bottom: 5px;
  color: #d63031;
}

header p {
  font-size: 16px;
  color: #666;
}

/* Onglets catégories */
.tabs {
  display: flex;
  background: rgba(255,255,255,0.9);
  border-bottom: 3px solid #ff6b35;
}

.tab-btn {
  flex: 1;
  padding: 18px 10px;
  border: none;
  background: none;
  font-size: 18px;
  font-weight: 600;
  color: #666;
  cursor: pointer;
  transition: all 0.3s ease;
  min-height: 60px;
}

.tab-btn.active {
  background: linear-gradient(135deg, #ff6b35, #f7931e);
  color: white;
  box-shadow: inset 0 -3px 0 #d63031;
}

/* Conteneur menu */
.menu-container {
  max-width: 400px;
  margin: 0 auto;
  padding: 20px 15px;
  min-height: calc(100vh - 200px);
}

/* Catégories */
.category {
  display: none;
}

.category.active {
  display: block;
  animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Articles menu - Tactile optimisé */
.menu-item {
  display: flex;
  align-items: center;
  background: rgba(255,255,255,0.95);
  margin-bottom: 15px;
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.1);
  cursor: pointer;
  transition: all 0.2s ease;
  min-height: 80px;
  touch-action: manipulation;
}

.menu-item:hover,
.menu-item.selected {
  transform: translateY(-5px);
  box-shadow: 0 15px 40px rgba(255,107,53,0.4);
  background: linear-gradient(135deg, #fff, #ffe5d9);
}

.menu-item.selected {
  border: 3px solid #ff6b35;
  background: linear-gradient(135deg, #ffecd2, #ffe5d9);
}

.emoji {
  font-size: 32px;
  margin-right: 20px;
  flex-shrink: 0;
}

.name {
  flex: 1;
  font-size: 20px;
  font-weight: 600;
  color: #333;
}

.price {
  font-size: 22px;
  font-weight: 700;
  color: #d63031;
  min-width: 70px;
  text-align: right;
}

/* Responsive */
@media (max-width: 400px) {
  .menu-container {
    padding: 15px 10px;
  }
  
  .tab-btn {
    font-size: 16px;
    padding: 16px 8px;
  }
}

/* Scroll fluide */
html {
  scroll-behavior: smooth;
}
</style>
